[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pianobot5000"
version = "0.1.0"
description = "Chord/melody chart -> piano-arrangement MIDI file (melody + chord-voiced left hand + section markers)"
requires-python = ">=3.10"
# Deliberately small: this is everything `pianobot chart ...` (the
# primary path -- see README) needs. No torch, no audio libraries,
# nothing to compile -- a plain `pip install pianobot5000` is enough,
# no Docker required. numpy/soundfile are only pulled in transitively
# by the optional `transcribe` extras below.
dependencies = [
    "pretty_midi>=0.2.10",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Everything below is only for `pianobot transcribe ...`, the
# optional (and heavier) audio-to-MIDI pipeline that guesses a chart
# from a recording instead of starting from a known one -- see the
# Dockerfile and README's "Transcribe mode" section. No version caps
# here on purpose -- the supported way to run this half of the project
# is the Linux container in Dockerfile, where the full ML ecosystem
# (torch, numba, tensorflow, ...) has current wheels for every one of
# these.
transcribe-stems = ["demucs>=4.0", "numpy>=1.24", "soundfile>=0.12"]
transcribe-melody = ["basic-pitch>=0.4"]
transcribe-chords = ["vamp>=1.1.0"]
# allin1 depends on madmom at runtime but never declares it (a real gap
# in allin1's own packaging) -- declaring it here so `pip install
# -e ".[transcribe-structure]"` at least gets a complete dependency set.
# madmom's own last PyPI release (0.16.1) doesn't import on Python
# 3.10+ at all (uses `from collections import MutableSequence`,
# removed in 3.10), so this pulls its fixed-but-never-released GitHub
# main branch instead. Separately, allin1 also doesn't *import*
# successfully against any natten release installable on current torch
# -- pyproject.toml alone doesn't fix that (it's a code patch, not a
# dependency); see patches/allin1/README.md and the Dockerfile for the
# actual fix.
transcribe-structure = ["allin1>=0.1", "madmom @ git+https://github.com/CPJKU/madmom.git"]
transcribe = ["pianobot5000[transcribe-stems,transcribe-melody,transcribe-chords,transcribe-structure]"]
# A second, much lighter chart-source importer: reads a MusicXML lead
# sheet (chords + melody) into a Chart instead of requiring one to be
# hand-written as JSON. music21 is a real dependency (not tiny), so
# it's its own extra rather than part of the base install.
charts-musicxml = ["music21>=9.1"]
dev = ["pytest>=8.0", "pianobot5000[charts-musicxml]"]

[project.scripts]
pianobot = "pianobot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
